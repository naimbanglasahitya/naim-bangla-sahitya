<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>নাঈম শিকদার | নাঈম বাংলা সাহিত্য</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans Bengali", "SolaimanLipi", Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f2, #f3e8ff, #e0f2fe);
      color: #222;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #7c3aed, #db2777, #ea580c);
      color: white;
      padding: 35px 20px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before,
    .header::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
    }

    .header::before {
      width: 180px;
      height: 180px;
      top: -80px;
      left: -50px;
    }

    .header::after {
      width: 230px;
      height: 230px;
      bottom: -150px;
      right: -70px;
    }

    .site-name {
      font-size: 17px;
      letter-spacing: 1px;
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.95;
    }

    /* Profile Card */
    .profile-card {
      width: 92%;
      max-width: 850px;
      margin: -55px auto 30px;
      background: rgba(255,255,255,0.96);
      border-radius: 25px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      position: relative;
      z-index: 2;
    }

    .profile-photo {
      width: 125px;
      height: 125px;
      margin: -90px auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #db2777, #f97316);
      padding: 5px;
      box-shadow: 0 8px 25px rgba(124,58,237,0.35);
    }

    .profile-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #fef3c7, #fce7f3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      font-weight: bold;
      color: #7c3aed;
    }

    .profile-card h2 {
      font-size: 29px;
      color: #7c3aed;
      margin-bottom: 5px;
    }

    .writer-title {
      color: #db2777;
      font-size: 16px;
      margin-bottom: 18px;
    }

    /* Social */
    .facebook-btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #1877f2, #2563eb);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      box-shadow: 0 6px 15px rgba(37,99,235,0.25);
      transition: 0.3s;
    }

    .facebook-btn:hover {
      transform: translateY(-2px);
    }

    /* Section */
    .section {
      width: 92%;
      max-width: 850px;
      margin: 25px auto;
    }

    .section-title {
      text-align: center;
      font-size: 24px;
      color: #7c3aed;
      margin-bottom: 18px;
      font-weight: bold;
    }

    /* About */
    .about {
      background: white;
      border-radius: 20px;
      padding: 25px;
      line-height: 1.9;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
      border-left: 5px solid #db2777;
    }

    .about p {
      font-size: 16px;
      text-align: justify;
    }

    /* Writing Types */
    .writing-types {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .type-card {
      background: white;
      padding: 20px 10px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 7px 20px rgba(0,0,0,0.07);
      transition: 0.3s;
    }

    .type-card:hover {
      transform: translateY(-5px);
    }

    .type-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .type-card h3 {
      font-size: 15px;
      color: #7c3aed;
    }

    /* Works */
    .work-card {
      background: linear-gradient(135deg, #ffffff, #fff7ed);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      border: 1px solid #f3
