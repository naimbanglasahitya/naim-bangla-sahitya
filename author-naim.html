
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাঈম — লেখকের প্রোফাইল</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .profile {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .profile h1 {
            margin-bottom: 10px;
        }

        .bio {
            color: #555;
            line-height: 1.7;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin: 25px 0;
        }

        .stat {
            background: #f0f0f0;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 24px;
        }

        .works h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .work {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .work h3 {
            margin: 0 0 5px;
        }

        .category {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>নাঈম</h1>

        <p class="bio">
            বাংলা সাহিত্যের একজন লেখক। কবিতা ও বিভিন্ন ধরনের
            সাহিত্যকর্মের মাধ্যমে নিজের ভাবনা ও অনুভূতি প্রকাশ করেন।
        </p>

        <div class="stats">
            <div class="stat">
                <strong>১</strong>
                মোট লেখা
            </div>

            <div class="stat">
                <strong>১</strong>
                কবিতা
            </div>
        </div>

        <div class="works">

            <h2>নাঈমের লেখা</h2>

            <div class="work">
                <h3>সেই যে তুমি ছেড়ে গেছো</h3>
                <div class="category">বিভাগ: কবিতা</div>
            </div>

        </div>

    </div>

</body>
</html>
