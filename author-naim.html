<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>নাঈম শিকদার | নাঈম বাংলা সাহিত্য প্ল্যাটফর্ম</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Noto Sans Bengali","SolaimanLipi",Arial,sans-serif;
  background:linear-gradient(135deg,#fff1f2,#f5f3ff,#e0f2fe);
  color:#222;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#4f46e5,#9333ea,#db2777,#f97316);
  color:white;
  text-align:center;
  padding:42px 18px 90px;
  position:relative;
  overflow:hidden;
}

.header:before,
.header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}

.header:before{
  width:190px;
  height:190px;
  left:-70px;
  top:-90px;
}

.header:after{
  width:240px;
  height:240px;
  right:-90px;
  bottom:-160px;
}

.platform{
  font-size:18px;
  font-weight:bold;
  letter-spacing:.5px;
}

.header h1{
  font-size:32px;
  margin-top:12px;
}

.header p{
  margin-top:8px;
  font-size:15px;
}

/* PROFILE */
.profile{
  width:92%;
  max-width:850px;
  margin:-65px auto 30px;
  background:white;
  border-radius:28px;
  padding:30px 20px;
  text-align:center;
  position:relative;
  z-index:2;
  box-shadow:0 15px 45px rgba(0,0,0,.13);
}

.avatar{
  width:125px;
  height:125px;
  border-radius:50%;
  margin:-90px auto 15px;
  padding:5px;
  background:linear-gradient(135deg,#f97316,#db2777,#7c3aed);
}

.avatar-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fef3c7,#fce7f3);
  color:#7c3aed;
  font-size:58px;
  font-weight:bold;
}

.profile h2{
  font-size:30px;
  color:#7c3aed;
}

.role{
  color:#db2777;
  margin:6px 0 18px;
}

.facebook{
  display:inline-block;
  text-decoration:none;
  color:white;
  padding:10px 23px;
  border-radius:30px;
  background:linear-gradient(135deg,#1877f2,#2563eb);
}

/* SECTIONS */
.section{
  width:92%;
  max-width:850px;
  margin:28px auto;
}

.title{
  text-align:center;
  font-size:24px;
  color:#7c3aed;
  font-weight:bold;
  margin-bottom:18px;
}

/* ABOUT */
.about{
  background:white;
  border-radius:22px;
  padding:25px;
  line-height:1.9;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
  border-left:6px solid #db2777;
}

.about p{
  font-size:16px;
  text-align:justify;
}

/* WRITING TYPES */
.writings{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.box{
  background:white;
  border-radius:20px;
  padding:22px 10px;
  text-align:center;
  box-shadow:0 7px 22px rgba(0,0,0,.07);
  transition:.3s;
}

.box:hover{
  transform:translateY(-5px);
}

.icon{
  font-size:30px;
  margin-bottom:8px;
}

.box h3{
  color:#7c3aed;
  font-size:16px;
}

/* WORK */
.work{
  background:linear-gradient(135deg,#fff,#fff7ed);
  border-radius:22px;
  padding:24px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.work h3{
  color:#db2777;
  font-size:22px;
}

.work p{
  color:#666;
  margin-top:7px;
}

.read{
  display:inline-block;
  margin-top:14px;
  padding:9px 20px;
  border-radius:25px;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#db2777);
}

/* QUOTE */
.quote{
  width:92%;
  max-width:850px;
  margin:35px auto;
  padding:30px 20px;
  border-radius:25px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#312e81,#7c3aed,#db2777);
  box-shadow:0 12px 30px rgba(124,58,237,.25);
}

.quote p{
  font-size:19px;
  line-height:1.8;
}

/* FOOTER */
footer{
  margin-top:40px;
  background:#171717;
  color:#ddd;
  text-align:center;
  padding:28px 15px;
  font-size:14px;
}

footer b{
  color:#f9a8d4;
}

/* MOBILE */
@media(max-width:600px){

  .platform{
    font-size:16px;
  }

  .header h1{
    font-size:28px;
  }

  .profile h2{
    font-size:26px;
  }

  .writings{
    grid-template-columns:repeat(2,1fr);
  }

  .about{
    padding:20px;
  }

  .about p{
    font-size:15px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="platform">
    নাঈম বাংলা সাহিত্য প্ল্যাটফর্ম
  </div>

  <h1>লেখকের প্রোফাইল</h1>

  <p>শব্দের ভেতর আমার গল্প</p>

</header>


<!-- PROFILE -->
<section class="profile">

  <div class="avatar">
    <div class="avatar-inner">ন</div>
  </div>

  <h2>নাঈম শিকদার</h2
